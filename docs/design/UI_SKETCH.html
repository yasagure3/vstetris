  :root {
    --cyan: #2dd6ff;

    --amber: #ffb84d;
    --line: #1e2a3f;
  }
  html, body { background: #05070c; }
  body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  .font-display { font-family: 'Orbitron', sans-serif; }
  .font-head { font-family: 'Rajdhani', sans-serif; letter-spacing: .02em; }
  .font-ui-mono { font-family: '"JetBrains Mono"', 'JetBrains Mono', monospace; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
  .neon-text { text-shadow: 0 0 8px currentColor, 0 0 20px currentColor; }
  .neon-border { box-shadow: 0 0 0 1px rgba(45,214,255,.4), 0 0 16px rgba(45,214,255,.25); }
  .neon-border-magenta { box-shadow: 0 0 0 1px rgba(255,46,203,.4), 0 0 16px rgba(255,46,203,.25); }

  /* 盤面: フラットなネオン角丸ではなく「ブロックの厚み」を感じさせるベベル */
  .grid-cell {
    width: 22px; height: 22px; border-radius: 2px;
    box-shadow: inset 1.5px 1.5px 0 rgba(255,255,255,.35), inset -1.5px -1.5px 0 rgba(0,0,0,.35);
  }
  .bg-grid {
    background-image: linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
                       linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* シグネチャー: パネル四隅の「ブロックスタッド」。汎用的な角丸カードと差別化する装飾 */
  .block-corners { position: relative; }
  .block-corners::before, .block-corners::after {
    content: ""; position: absolute; width: 7px; height: 7px;
    background: var(--cyan); box-shadow: 0 0 6px var(--cyan);
  }
  .block-corners::before { top: -3.5px; left: -3.5px; }
  .block-corners::after { bottom: -3.5px; right: -3.5px; background: var(--magenta); box-shadow: 0 0 6px var(--magenta); }

  /* シグネチャー: 一本線の代わりに使う「ブロック状」の区切り罫線 */
  .brick-rule { position: relative; }
  .brick-rule::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background-image: linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px);
    background-size: 10px 2px; background-repeat: repeat-x;
  }

  @keyframes toast-in { from { opacity:0; transform: translateY(-8px);} to {opacity:1; transform: translateY(0);} }
  .toast-in { animation: toast-in .18s ease-out; }
  .tab-btn { transition: color .15s, border-color .15s; }

  /* Home hero: 積み上がって着地するテトリミノの演出(シグネチャー要素) */
  @keyframes tet-fall {
    0% { transform: translateY(-160px) rotate(-6deg); opacity: 0; }
    65% { transform: translateY(4px) rotate(1deg); opacity: 1; }
    80% { transform: translateY(-3px) rotate(0deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .tet-fall { animation: tet-fall .7s cubic-bezier(.2,.8,.2,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .tet-fall { animation: none; }
  }
</style>

    <div className={"shrink-0 rounded-lg border bg-panel px-3 py-2 text-center " + ring} style={{minWidth: 120}}>
      <div className="text-xs font-semibold">{label}</div>
      {sub && <div className="text-[10px] text-slate-500 mt-0.5">{sub}</div>}
    </div>
  );
}
function Arrow({ label }) {
  return (
    <div className="flex flex-col items-center shrink-0 px-1">
      {label && <div className="text-[10px] text-slate-500 mb-0.5 whitespace-nowrap">{label}</div>}

        <polygon points="28,3 36,8 28,13" fill="#475569" />
      </svg>
    </div>
  );
}

}

const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = (type, msg) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, type, msg }].slice(-3));
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000);
  };
  const colors = { success: "border-lime-500/50 text-lime-300", error: "border-rose-500/50 text-rose-300", info: "border-cyan-500/50 text-cyan-300" };
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="fixed top-4 right-4 z-50 space-y-2 w-72">
        {toasts.map(t => (
          <div key={t.id} className={"toast-in rounded-lg border bg-panel px-3 py-2 text-sm shadow-lg " + colors[t.type]}>{t.msg}</div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
function useToast() { return useContext(ToastCtx); }

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { hasError: false }; }

  render() {
    if (this.state.hasError) {

const PIECE_COLORS = ["bg-cyan-400", "bg-yellow-400", "bg-fuchsia-400", "bg-lime-400", "bg-rose-400", "bg-blue-400", "bg-orange-400"];
/* US-025: 色だけに頼らず模様/記号でもミノを区別するための対応記号(色覚サポートモード用) */
const PIECE_SYMBOLS = ["■", "●", "▲", "◆", "✕", "▶", "★"];
function seededCell(x, y, seed) {
  const v = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
  const f = v - Math.floor(v);
  if (f > 0.72) {
    const idx = Math.floor(f * 100) % PIECE_COLORS.length;
    return { color: PIECE_COLORS[idx], symbol: PIECE_SYMBOLS[idx] };
  }
  return null;
}
function Board({ cols = 10, rows = 16, seed = 1, garbage = 0, small = false, patternMode = false }) {
  const cellCls = small ? "w-3.5 h-3.5" : "grid-cell";
  return (
    <div className="inline-block bg-black/40 p-1.5 rounded-md border border-border bg-grid">
      {Array.from({ length: rows }).map((_, y) => (
        <div key={y} className="flex gap-0.5 mb-0.5">
          {Array.from({ length: cols }).map((_, x) => {
            const isGarbage = y >= rows - garbage;
            const cell = isGarbage ? null : seededCell(x, y, seed);
            const color = isGarbage ? "bg-slate-600/70" : (cell ? cell.color : null);
            return (
              <div key={x} className={cellCls + " rounded-[2px] flex items-center justify-center leading-none " + (color ? color + " shadow-[0_0_6px_rgba(255,255,255,.25)]" : "bg-white/5")}>
                {patternMode && !isGarbage && cell && !small && (
                  <span className="text-[9px] text-black/70">{cell.symbol}</span>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

const MINO_SHAPES = {
  I: { cells: [[0,0],[1,0],[2,0],[3,0]], color: "bg-cyan-400", shadow: "shadow-[0_0_10px_rgba(45,214,255,.6)]" },
  O: { cells: [[0,0],[1,0],[0,1],[1,1]], color: "bg-yellow-400", shadow: "shadow-[0_0_10px_rgba(250,204,21,.5)]" },
  T: { cells: [[0,0],[1,0],[2,0],[1,1]], color: "bg-fuchsia-400", shadow: "shadow-[0_0_10px_rgba(255,46,203,.5)]" },
  S: { cells: [[1,0],[2,0],[0,1],[1,1]], color: "bg-lime-400", shadow: "shadow-[0_0_10px_rgba(195,255,61,.5)]" },
};
function MiniTetromino({ shape, delay = 0 }) {
  const { cells, color, shadow } = MINO_SHAPES[shape];
  return (
    <div className="relative tet-fall" style={{ width: 76, height: 40, animationDelay: delay + "ms" }}>
      {cells.map(([x, y], i) => (
        <div key={i} className={"absolute rounded-[2px] " + color + " " + shadow}
          style={{ width: 18, height: 18, left: x * 19, top: y * 19,
                   boxShadow: "inset 1.5px 1.5px 0 rgba(255,255,255,.35), inset -1.5px -1.5px 0 rgba(0,0,0,.35)" }} />
      ))}
    </div>
  );
}

const REACTION_LIMIT = 5;
const REACTION_WINDOW_MS = 5000;
function Spectate({ nav, toast }) {
  const [reactions, setReactions] = useState([]);
  const [showReport, setShowReport] = useState(false);
  const recentTimestamps = useRef([]);

  const sendReaction = (e) => {
    const now = Date.now();
    recentTimestamps.current = recentTimestamps.current.filter(t => now - t < REACTION_WINDOW_MS);
    if (recentTimestamps.current.length >= REACTION_LIMIT) {
      toast("error", "リアクションを送りすぎています。少し待ってから送ってください(US-016)");
      return;
    }
    recentTimestamps.current.push(now);
    setReactions(r => [...r, e + Math.random()]);
  };

  return (
    <div className="max-w-3xl mx-auto p-8">
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-head text-2xl font-semibold text-fuchsia-300">観戦中: Player_10 vs Player_11</h2>
        <div className="flex items-center gap-3">
          <button className="text-xs text-slate-500 hover:text-rose-400" onClick={() => setShowReport(true)}>通報する</button>
          <GhostBtn onClick={() => nav("spectateList")}>一覧に戻る</GhostBtn>
        </div>
      </div>
      <div className="flex justify-center gap-10 mb-4">
        <Board seed={4} small />
        <Board seed={9} garbage={1} small />
      </div>
      <div className="flex justify-center gap-2">
        {["🔥","👏","😱"].map(e => (
          <button key={e} className="px-3 py-1.5 rounded border border-border hover:bg-panel2" onClick={() => sendReaction(e)}>{e}</button>
        ))}
      </div>
      <p className="text-center text-[10px] text-slate-600 mt-1">{REACTION_WINDOW_MS / 1000}秒間に{REACTION_LIMIT}回まで送信できます(スパム防止)</p>
      <div className="flex justify-center gap-1 mt-2 flex-wrap">
        {reactions.slice(-10).map(r => <span key={r} className="text-lg">{r[0]}</span>)}
      </div>
      {showReport && <ReportModal onClose={() => setShowReport(false)} onSubmit={() => { setShowReport(false); toast("success", "通報を送信しました"); }} />}
    </div>
  );
}

   ========================================================================= */
function PrototypeApp() {
  const [screen, setScreen] = useState("home");
  const [auth, setAuth] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [next, setNext] = useState(null);
  const [boom, setBoom] = useState(false);
  const toast = useToast();

  /* 「history」は含めない: ゲスト/未ログインはログイン強制ではなく画面内で案内する(US-013) */
  const authRequired = ["account"];

  const nav = (s) => {
    if (s === "adminReports") {
      if (!auth) {
        setNext(s);
        setScreen("login");
        toast("info", "ログインが必要です");
        return;
      }
      if (!isAdmin) {
        setScreen("forbidden");
        return;
      }
      setScreen(s);
      return;
    }
    if (authRequired.includes(s) && !auth) {
      setNext(s);
      setScreen("login");
      toast("info", "ログインが必要です");
      return;
    }
    setScreen(s);
  };

  const screenProps = { nav, auth, setAuth, toast, next, isAdmin, setIsAdmin };
  const isFullscreen = screen === "battle";

  const renderScreen = () => {
    switch (screen) {
      case "home": return <Home {...screenProps} />;
      case "login": return <Login {...screenProps} />;
      case "signup": return <Signup {...screenProps} />;
      case "passwordReset": return <PasswordReset {...screenProps} />;
      case "matchmaking": return <Matchmaking {...screenProps} />;
      case "room": return <Room {...screenProps} />;
      case "battle": return <Battle {...screenProps} />;
      case "result": return <Result {...screenProps} />;
      case "spectateList": return <SpectateList {...screenProps} />;
      case "spectate": return <Spectate {...screenProps} />;
      case "history": return <History {...screenProps} />;
      case "replay": return <Replay {...screenProps} />;
      case "account": return <Account {...screenProps} />;
      case "tutorial": return <Tutorial {...screenProps} />;
      case "adminReports": return <AdminReports {...screenProps} />;
      case "notFound": return <NotFound {...screenProps} />;
      case "forbidden": return <Forbidden {...screenProps} />;
      case "networkError": return <NetworkError {...screenProps} />;
      default: return <NotFound {...screenProps} />;
    }
  };

  return (
    <div className="min-h-[80vh] bg-bg">
      {!isFullscreen && <TopNav nav={nav} auth={auth} setAuth={setAuth} jump={nav} isAdmin={isAdmin} setIsAdmin={setIsAdmin} />}
      <ErrorBoundary key={boom}>
        {boom ? <Boom /> : renderScreen()}
      </ErrorBoundary>
      {!isFullscreen && (
        <div className="fixed bottom-3 right-3">
          <button className="text-[10px] px-2 py-1 rounded border border-dashed border-slate-700 text-slate-600 hover:text-rose-400 hover:border-rose-500/40"
            onClick={() => setBoom(true)}>⚠ ErrorBoundaryデモ</button>
        </div>
      )}
    </div>
  );
}

  { key: "elements", label: "画面要素・インタラクション" },
  { key: "design", label: "デザイン方針" },
];

function App() {
  const [tab, setTab] = useState("overview");
  return (
    <div className="min-h-screen">
      <div className="border-b border-border sticky top-0 z-50 bg-bg/95 backdrop-blur brick-rule">
        <div className="max-w-6xl mx-auto flex gap-1 px-4 overflow-x-auto">
          {TABS.map(t => (
            <button key={t.key}
              className={"tab-btn whitespace-nowrap px-4 py-3 text-sm border-b-2 " + (tab === t.key ? "border-cyan-400 text-cyan-300" : "border-transparent text-slate-500 hover:text-slate-300")}
              onClick={() => setTab(t.key)}>{t.label}</button>
          ))}
        </div>
      </div>
      {tab === "overview" && <OverviewTab />}
      {tab === "flows" && <FlowsTab />}
      {tab === "prototype" && <PrototypeTab />}
      {tab === "elements" && <ElementsTab />}
      {tab === "design" && <DesignTab />}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
